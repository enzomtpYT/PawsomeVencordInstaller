# Based partially on Alyxia's work, thanks so much!

name: Release
on:
  push:
    tags:
      - v*

env:
  FORCE_COLOR: true

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest # Go without CGO seems to not depend on glibc, so building on latest should be fine

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y pkg-config libsdl2-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libglx-dev libgl1-mesa-dev libxxf86vm-dev libglfw3-dev libwayland-dev libwayland-egl1 libegl-dev libxkbcommon-dev wayland-protocols extra-cmake-modules

      - name: Install Go dependencies
        run: go get -v

      - name: Recreate vendor and apply Wayland patches
        run: |
          go mod vendor
          git apply patches/wayland.patch

      - name: Build GUI (X11)
        run:
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -tags static -ldflags "-s
          -w -X 'PawsomeVencordInstaller/buildinfo.InstallerGitHash=$(git rev-parse --short
          HEAD)' -X 'PawsomeVencordInstaller/buildinfo.InstallerTag=${{ github.ref_name }}'" -o
          PawsomeVencordInstaller-x11

      - name: Build GUI (Wayland)
        run:
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -tags "static wayland"
          -ldflags "-s -w -X 'PawsomeVencordInstaller/buildinfo.InstallerGitHash=$(git
          rev-parse --short HEAD)' -X 'PawsomeVencordInstaller/buildinfo.InstallerTag=${{
          github.ref_name }}'" -o PawsomeVencordInstaller-wayland

      - name: Build GUI (Combined)
        run:
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -tags "static combined"
          -ldflags "-s -w -X 'PawsomeVencordInstaller/buildinfo.InstallerGitHash=$(git
          rev-parse --short HEAD)' -X 'PawsomeVencordInstaller/buildinfo.InstallerTag=${{
          github.ref_name }}'" -o PawsomeVencordInstaller

      - name: Build CLI
        run:
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -tags "cli" -ldflags "-s
          -w -X 'PawsomeVencordInstaller/buildinfo.InstallerGitHash=$(git rev-parse --short
          HEAD)' -X 'PawsomeVencordInstaller/buildinfo.InstallerTag=${{ github.ref_name }}'" -o
          PawsomeVencordInstallerCli-linux

      - name: Update executable
        run: |
          chmod +x PawsomeVencordInstaller*

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PawsomeVencordInstaller-linux
          path: |
            PawsomeVencordInstaller-x11
            PawsomeVencordInstaller-wayland
            PawsomeVencordInstaller
            PawsomeVencordInstallerCli-linux

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm # Native ARM64 runner, the GUI needs ARM64 X11/Wayland/GL libraries

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-arm64-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-arm64-go-

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y pkg-config libsdl2-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libglx-dev libgl1-mesa-dev libxxf86vm-dev libglfw3-dev libwayland-dev libwayland-egl1 libegl-dev libxkbcommon-dev wayland-protocols extra-cmake-modules

      - name: Install Go dependencies
        run: go get -v

      - name: Recreate vendor and apply Wayland patches
        run: |
          go mod vendor
          git apply patches/wayland.patch

      - name: Build GUI (X11)
        run: CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -v -tags static -ldflags "-s -w -X 'PawsomeVencordInstaller/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'PawsomeVencordInstaller/buildinfo.InstallerTag=${{ github.ref_name }}'" -o PawsomeVencordInstaller-x11-arm64

      - name: Build GUI (Wayland)
        run: CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -v -tags "static wayland" -ldflags "-s -w -X 'PawsomeVencordInstaller/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'PawsomeVencordInstaller/buildinfo.InstallerTag=${{ github.ref_name }}'" -o PawsomeVencordInstaller-wayland-arm64

      - name: Build GUI (Combined)
        run: CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -v -tags "static combined" -ldflags "-s -w -X 'PawsomeVencordInstaller/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'PawsomeVencordInstaller/buildinfo.InstallerTag=${{ github.ref_name }}'" -o PawsomeVencordInstaller-arm64

      - name: Build CLI
        run: CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -v -tags "cli" -ldflags "-s -w -X 'PawsomeVencordInstaller/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'PawsomeVencordInstaller/buildinfo.InstallerTag=${{ github.ref_name }}'" -o PawsomeVencordInstallerCli-linux-arm64

      - name: Update executable
        run: |
          chmod +x PawsomeVencordInstaller*

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PawsomeVencordInstaller-linux-arm64
          path: |
            PawsomeVencordInstaller-x11-arm64
            PawsomeVencordInstaller-wayland-arm64
            PawsomeVencordInstaller-arm64
            PawsomeVencordInstallerCli-linux-arm64

  build-mac:
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
            artifact_name: PawsomeVencordInstaller-macos
            dmg_name: PawsomeVencordInstaller-x64.dmg
          - arch: arm64
            runner: macos-latest
            artifact_name: PawsomeVencordInstaller-macos-arm64
            dmg_name: PawsomeVencordInstaller-arm64.dmg

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-${{ matrix.arch }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-go-

      - name: Install dependencies
        run: brew install sdl2 create-dmg

      - name: Install Go dependencies
        run: go get -v

      - name: Import signing certificate
        if: env.CSC_LINK != ''
        env:
          CSC_LINK: ${{ secrets.APPLE_SIGNING_CERT }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
        run: |
          echo "$CSC_LINK" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm certificate.p12

      - name: Build DMG
        run: |
          make ARCH=${{ matrix.arch }} GUI=1 DMG=1 IDENTITY="${{ secrets.APPLE_SIGNING_CERT != '' && 'Developer ID Application' || '-' }}" VERSION=${{ github.ref_name }}
          mv build/PawsomeVencordInstaller.dmg ${{ matrix.dmg_name }}

      - name: Notarize the DMG
        if: env.API_KEY != ''
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "$API_KEY" > apple.p8
          xcrun notarytool submit ${{ matrix.dmg_name }} --key apple.p8 --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple ${{ matrix.dmg_name }}
          rm apple.p8

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.dmg_name }}

  build-mac-dmg:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-universal-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-universal-go-

      - name: Install dependencies
        run: brew install sdl2 create-dmg

      - name: Install Go dependencies
        run: go get -v

      - name: Import signing certificate
        if: env.CSC_LINK != ''
        env:
          CSC_LINK: ${{ secrets.APPLE_SIGNING_CERT }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
        run: |
          echo "$CSC_LINK" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm certificate.p12

      - name: Build universal DMG
        run: make ARCH=universal GUI=1 DMG=1 IDENTITY="${{ secrets.APPLE_SIGNING_CERT != '' && 'Developer ID Application' || '-' }}" VERSION=${{ github.ref_name }}

      - name: Notarize the DMG
        if: env.API_KEY != ''
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "$API_KEY" > apple.p8
          xcrun notarytool submit build/PawsomeVencordInstaller.dmg --key apple.p8 --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple build/PawsomeVencordInstaller.dmg
          rm apple.p8

      - name: Build CLI
        run: |
          make ARCH=amd64 GUI=0 VERSION=${{ github.ref_name }}
          mv build/PawsomeVencordInstallerCli-darwin build/PawsomeVencordInstallerCli-x64
          make ARCH=arm64 GUI=0 VERSION=${{ github.ref_name }}
          mv build/PawsomeVencordInstallerCli-darwin build/PawsomeVencordInstallerCli-arm64
          make ARCH=universal GUI=0 VERSION=${{ github.ref_name }}
          mv build/PawsomeVencordInstallerCli-darwin build/PawsomeVencordInstallerCli-universal
          for f in build/PawsomeVencordInstallerCli-*; do
            codesign --force --options runtime --sign "${{ secrets.APPLE_SIGNING_CERT != '' && 'Developer ID Application' || '-' }}" "$f"
            lipo -info "$f"
          done

      - name: Notarize the CLI
        if: env.API_KEY != ''
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "$API_KEY" > apple.p8
          for f in build/PawsomeVencordInstallerCli-*; do
            ditto -c -k "$f" "$f.zip"
            xcrun notarytool submit "$f.zip" --key apple.p8 --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
            rm "$f.zip"
          done
          rm apple.p8

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PawsomeVencordInstaller-macos-universal
          path: |
            build/PawsomeVencordInstaller.dmg
            build/PawsomeVencordInstallerCli-x64
            build/PawsomeVencordInstallerCli-arm64
            build/PawsomeVencordInstallerCli-universal

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\go-build
            ~\go\pkg\mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Setup MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          path-type: inherit

      - name: Install Windows dependencies
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm git mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2

      - name: Install Go dependencies
        shell: msys2 {0}
        run: |
          go get -v
          go install github.com/tc-hib/go-winres@d743268d7ea168077ddd443c4240562d4f5e8c3e  # v0.3.3

      - name: Build GUI
        shell: msys2 {0}
        run: |
          go-winres make --product-version "git-tag"
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -v -tags "static gui" -ldflags "-s -w -H=windowsgui -extldflags=-static -X 'PawsomeVencordInstaller/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'PawsomeVencordInstaller/buildinfo.InstallerTag=${{ github.ref_name }}'" -o PawsomeVencordInstaller.exe

      - name: Build CLI
        shell: msys2 {0}
        run: |
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -v -tags "cli" -ldflags "-s -w -X 'PawsomeVencordInstaller/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'PawsomeVencordInstaller/buildinfo.InstallerTag=${{ github.ref_name }}'" -o PawsomeVencordInstallerCli.exe
          cp PawsomeVencordInstallerCli.exe PawsomeVencordInstallerCli-x64.exe # Explicit arch in the name, winget picks installers by it

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PawsomeVencordInstaller-windows
          path: |
            PawsomeVencordInstaller.exe
            PawsomeVencordInstallerCli.exe
            PawsomeVencordInstallerCli-x64.exe

  build-windows-arm64:
    runs-on: windows-latest # No ARM64 runner needed, the ARM64 binaries are cross-compiled

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\go-build
            ~\go\pkg\mod
          key: ${{ runner.os }}-arm64-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-arm64-go-

      # The GUI needs a C/C++ compiler targeting ARM64 Windows, llvm-mingw provides one
      - name: Install llvm-mingw
        shell: pwsh
        run: |
          $version = "20260908"
          $sha256 = "1bcf74d06b724aeecaa6412ca85f5b26fb1da770e7cdcefa9263c9c5c3ad34b6"
          $zip = "$env:RUNNER_TEMP\llvm-mingw.zip"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/llvm-mingw-$version-ucrt-x86_64.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $sha256) { throw "llvm-mingw checksum mismatch" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\llvm-mingw-$version-ucrt-x86_64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Go dependencies
        shell: bash
        run: |
          go get -v
          go install github.com/tc-hib/go-winres@d743268d7ea168077ddd443c4240562d4f5e8c3e  # v0.3.3

      - name: Build GUI
        shell: bash
        run: |
          "$(go env GOPATH)/bin/go-winres" make --arch arm64 --product-version "git-tag"
          CGO_ENABLED=1 GOOS=windows GOARCH=arm64 CC=aarch64-w64-mingw32-clang CXX=aarch64-w64-mingw32-clang++ go build -v -tags "static gui" -ldflags "-s -w -H=windowsgui -extldflags=-static -X 'PawsomeVencordInstaller/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'PawsomeVencordInstaller/buildinfo.InstallerTag=${{ github.ref_name }}'" -o PawsomeVencordInstaller-arm64.exe

      - name: Build CLI
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -v -tags "cli" -ldflags "-s -w -X 'PawsomeVencordInstaller/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'PawsomeVencordInstaller/buildinfo.InstallerTag=${{ github.ref_name }}'" -o PawsomeVencordInstallerCli-arm64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PawsomeVencordInstaller-windows-arm64
          path: |
            PawsomeVencordInstaller-arm64.exe
            PawsomeVencordInstallerCli-arm64.exe

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-linux-arm64, build-mac, build-mac-dmg, build-windows, build-windows-arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Download Linux Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PawsomeVencordInstaller-linux
          path: linux

      - name: "Download Linux ARM64 Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PawsomeVencordInstaller-linux-arm64
          path: linux

      - name: "Download MacOS Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PawsomeVencordInstaller-macos
          path: macos

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PawsomeVencordInstaller-macos-arm64
          path: macos

      - name: "Download MacOS DMG"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PawsomeVencordInstaller-macos-universal
          path: macos

      - name: "Download Windows Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PawsomeVencordInstaller-windows
          path: windows

      - name: "Download Windows ARM64 Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PawsomeVencordInstaller-windows-arm64
          path: windows

      - name: Delete existing release
        run: gh release delete "${{ github.ref_name }}" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          make_latest: ${{ !contains(github.ref_name, '-') }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: false
          body: |
            This is release ${{ github.ref_name }} of PawsomeVencordInstaller.
          files: |
            linux/PawsomeVencordInstaller-x11
            linux/PawsomeVencordInstaller-wayland
            linux/PawsomeVencordInstaller
            linux/PawsomeVencordInstallerCli-linux
            linux/PawsomeVencordInstaller-x11-arm64
            linux/PawsomeVencordInstaller-wayland-arm64
            linux/PawsomeVencordInstaller-arm64
            linux/PawsomeVencordInstallerCli-linux-arm64
            macos/PawsomeVencordInstaller-x64.dmg
            macos/PawsomeVencordInstaller-arm64.dmg
            macos/PawsomeVencordInstaller.dmg
            macos/PawsomeVencordInstallerCli-x64
            macos/PawsomeVencordInstallerCli-arm64
            macos/PawsomeVencordInstallerCli-universal
            windows/PawsomeVencordInstaller*.exe
